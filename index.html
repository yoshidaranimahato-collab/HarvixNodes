<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HarvixPanel</title>

  <style>
    :root {
      --bg: #090c12;
      --card: #111722;
      --card2: #0d131d;
      --border: #252d3a;
      --text: #edf2f7;
      --muted: #9ba7b7;
      --primary: #7c5cff;
      --primary2: #6847f5;
      --danger: #ff6262;
      --success: #48d597;
      --warning: #f4c95d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(17, 23, 34, .95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      min-height: 64px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .small-card {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .muted {
      color: var(--muted);
    }

    .success {
      color: var(--success);
    }

    .danger {
      color: var(--danger);
    }

    .warning {
      color: var(--warning);
    }

    input,
    select {
      width: 100%;
      padding: 11px 12px;
      margin: 5px 0;
      color: var(--text);
      background: #090e16;
      border: 1px solid #303a49;
      border-radius: 9px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
    }

    button {
      border: 1px solid #303a49;
      background: #0c121c;
      color: white;
      padding: 10px 13px;
      border-radius: 9px;
      margin: 4px;
    }

    button:hover {
      border-color: var(--primary);
    }

    .primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    .primary:hover {
      background: var(--primary2);
    }

    .danger-btn {
      background: #35151a;
      border-color: #70313a;
    }

    .success-btn {
      background: #10291f;
      border-color: #286c4e;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .server-card {
      margin-bottom: 16px;
    }

    .server-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .server-name {
      font-size: 19px;
      font-weight: bold;
    }

    .status {
      padding: 5px 9px;
      border-radius: 999px;
      background: #202936;
      font-size: 12px;
    }

    .status.running {
      color: var(--success);
      background: #10291f;
    }

    .status.stopped {
      color: var(--muted);
    }

    .status.restarting,
    .status.reinstalling {
      color: var(--warning);
      background: #302914;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 13px;
    }

    .tabs button {
      font-size: 13px;
    }

    .module {
      margin-top: 14px;
      padding: 15px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .module pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #070a0f;
      padding: 12px;
      border-radius: 8px;
      min-height: 130px;
      color: #cdd6e4;
      overflow: auto;
    }

    .auth {
      max-width: 430px;
      margin: 50px auto;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 12px;
    }

    .auth-tabs button {
      flex: 1;
    }

    .user-info {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
    }

    .admin-badge {
      color: #d7caff;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #32161a;
      color: #ff9ca4;
    }

    .message.ok {
      background: #10291f;
      color: #83e2b3;
    }

    .stat {
      font-size: 24px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: var(--muted);
    }

    hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 18px 0;
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 25px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      main {
        padding: 12px;
      }

      .header-inner {
        padding: 0 12px;
      }

      .header-right {
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .user-info {
        display: none;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">⚡ HarvixPanel</div>

    <div class="header-right">
      <span id="userInfo" class="user-info hidden"></span>
      <button id="adminButton" class="primary hidden" onclick="showAdmin()">Admin Panel</button>
      <button id="logoutButton" class="hidden" onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<main>

  <!-- =====================================================
       AUTH
       ===================================================== -->

  <section id="authSection" class="auth">

    <div class="card">

      <h2 id="authTitle">Login</h2>

      <div class="auth-tabs">
        <button onclick="showLogin()">Login</button>
        <button onclick="showRegister()">Register</button>
      </div>

      <div id="loginBox">

        <input
          id="loginUsername"
          placeholder="Username"
          autocomplete="username"
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button class="primary" onclick="login()">
          Login
        </button>

      </div>

      <div id="registerBox" class="hidden">

        <input
          id="registerUsername"
          placeholder="Username"
          autocomplete="username"
        >

        <input
          id="registerPassword"
          type="password"
          placeholder="Password (minimum 6 characters)"
          autocomplete="new-password"
        >

        <button class="primary" onclick="registerUser()">
          Create Account
        </button>

      </div>

      <div id="authMessage" class="message"></div>

    </div>

  </section>


  <!-- =====================================================
       DASHBOARD
       ===================================================== -->

  <section id="dashboardSection" class="hidden">

    <div class="top-actions">

      <button class="primary" onclick="showDashboard()">
        🏠 Dashboard
      </button>

      <button id="adminTopButton" class="hidden" onclick="showAdmin()">
        👑 Admin
      </button>

      <button onclick="loadServers()">
        🔄 Refresh
      </button>

    </div>


    <!-- Create Server -->

    <div class="card">

      <h2>➕ Create Server</h2>

      <p class="muted">
        Normal users: maximum 4096 MB RAM, 5120 MB disk and 1 vCore.
      </p>

      <div class="grid">

        <div>
          <label>Server Name</label>
          <input id="serverName" placeholder="My Survival Server">
        </div>

        <div>
          <label>RAM (MB)</label>
          <input id="serverRam" type="number" value="1024" min="1">
        </div>

        <div>
          <label>Disk (MB)</label>
          <input id="serverDisk" type="number" value="2048" min="1">
        </div>

        <div>
          <label>CPU (vCore)</label>
          <input id="serverCpu" type="number" value="1" min="0.1" step="0.1">
        </div>

        <div>
          <label>Software</label>
          <select id="serverSoftware">
            <option>Paper</option>
            <option>Vanilla</option>
            <option>Fabric</option>
            <option>Forge</option>
          </select>
        </div>

        <div>
          <label>Version</label>
          <input id="serverVersion" value="1.21.4">
        </div>

      </div>

      <button class="primary" onclick="createServer()">
        Create Server
      </button>

      <div id="createMessage" class="message"></div>

    </div>


    <!-- Servers -->

    <div class="card">

      <h2>🖥️ My Servers</h2>

      <div id="servers">
        Loading...
      </div>

    </div>

  </section>


  <!-- =====================================================
       ADMIN PANEL
       ===================================================== -->

  <section id="adminSection" class="hidden">

    <div class="top-actions">

      <button onclick="showDashboard()">
        🏠 Dashboard
      </button>

      <button class="primary" onclick="showAdmin()">
        👑 Admin Panel
      </button>

    </div>


    <div class="card">

      <h2>👑 Admin Panel</h2>

      <div class="tabs">

        <button onclick="adminSettings()">
          ⚙️ Settings
        </button>

        <button onclick="adminNodes()">
          🖥️ Nodes
        </button>

        <button onclick="adminCreateServer()">
          ➕ Create Server
        </button>

        <button onclick="adminUsers()">
          👥 Users
        </button>

        <button onclick="adminTheme()">
          🎨 Theme
        </button>

      </div>

    </div>

    <div id="adminContent"></div>

  </section>

</main>

<footer>
  HarvixPanel • HarvixNodes
</footer>


<script>
/* =========================================================
   GLOBAL STATE
   ========================================================= */

let authToken = localStorage.getItem("harvix_token") || "";
let currentUser = null;


/* =========================================================
   API HELPER
   ========================================================= */

async function api(url, options = {}) {

  const headers = {
    ...(options.headers || {})
  };

  if (authToken) {
    headers.Authorization = "Bearer " + authToken;
  }

  if (
    options.body &&
    typeof options.body !== "string"
  ) {
    headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(options.body);
  }

  const response = await fetch(url, {
    ...options,
    headers
  });

  let data = {};

  try {
    data = await response.json();
  } catch {
    data = {};
  }

  if (!response.ok) {
    throw new Error(
      data.error || "Request failed"
    );
  }

  return data;
}


/* =========================================================
   AUTH UI
   ========================================================= */

function showLogin() {

  document.getElementById("authTitle").textContent = "Login";

  document.getElementById("loginBox")
    .classList.remove("hidden");

  document.getElementById("registerBox")
    .classList.add("hidden");

  clearMessage("authMessage");
}


function showRegister() {

  document.getElementById("authTitle").textContent = "Create Account";

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("registerBox")
    .classList.remove("hidden");

  clearMessage("authMessage");
}


function showMessage(id, text, type = "ok") {

  const element = document.getElementById(id);

  if (!element) return;

  element.textContent = text;

  element.className =
    "message show " +
    (type === "error" ? "error" : "ok");
}


function clearMessage(id) {

  const element = document.getElementById(id);

  if (!element) return;

  element.textContent = "";
  element.className = "message";
}


/* =========================================================
   REGISTER
   ========================================================= */

async function registerUser() {

  const username =
    document.getElementById("registerUsername").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  if (!username || !password) {

    showMessage(
      "authMessage",
      "Username and password are required.",
      "error"
    );

    return;
  }

  try {

    await api("/api/auth/register", {
      method: "POST",
      body: {
        username,
        password
      }
    });

    showMessage(
      "authMessage",
      "Account created successfully. You can now login."
    );

    document.getElementById("registerPassword").value = "";

    showLogin();

  } catch (error) {

    showMessage(
      "authMessage",
      error.message,
      "error"
    );
  }
}


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

  const username =
    document.getElementById("loginUsername").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if (!username || !password) {

    showMessage(
      "authMessage",
      "Enter username and password.",
      "error"
    );

    return;
  }

  try {

    const result = await api(
      "/api/auth/login",
      {
        method: "POST",
        body: {
          username,
          password
        }
      }
    );

    authToken = result.token;

    localStorage.setItem(
      "harvix_token",
      authToken
    );

    currentUser = result.user;

    updateHeader();

    showDashboard();

  } catch (error) {

    showMessage(
      "authMessage",
      error.message,
      "error"
    );
  }
}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout() {

  try {

    await api(
      "/api/auth/logout",
      {
        method: "POST"
      }
    );

  } catch {}

  authToken = "";

  currentUser = null;

  localStorage.removeItem(
    "harvix_token"
  );

  updateHeader();

  document.getElementById("dashboardSection")
    .classList.add("hidden");

  document.getElementById("adminSection")
    .classList.add("hidden");

  document.getElementById("authSection")
    .classList.remove("hidden");

  showLogin();
}


/* =========================================================
   CHECK LOGIN
   ========================================================= */

async function checkLogin() {

  if (!authToken) {

    updateHeader();

    return;
  }

  try {

    currentUser =
      await api("/api/auth/me");

    updateHeader();

    showDashboard();

  } catch {

    authToken = "";

    localStorage.removeItem(
      "harvix_token"
    );

    updateHeader();
  }
}


/* =========================================================
   HEADER
   ========================================================= */

function updateHeader() {

  const userInfo =
    document.getElementById("userInfo");

  const logoutButton =
    document.getElementById("logoutButton");

  const adminButton =
    document.getElementById("adminButton");

  const adminTopButton =
    document.getElementById("adminTopButton");

  if (!currentUser) {

    userInfo.classList.add("hidden");

    logoutButton.classList.add("hidden");

    adminButton.classList.add("hidden");

    adminTopButton.classList.add("hidden");

    return;
  }

  userInfo.textContent =
    currentUser.username +
    " • " +
    currentUser.role;

  userInfo.classList.remove("hidden");

  logoutButton.classList.remove("hidden");

  if (currentUser.role === "admin") {

    adminButton.classList.remove("hidden");

    adminTopButton.classList.remove("hidden");

  } else {

    adminButton.classList.add("hidden");

    adminTopButton.classList.add("hidden");
  }
}


/* =========================================================
   PAGE SWITCHING
   ========================================================= */

function hideAllSections() {

  document.getElementById("authSection")
    .classList.add("hidden");

  document.getElementById("dashboardSection")
    .classList.add("hidden");

  document.getElementById("adminSection")
    .classList.add("hidden");
}


function showDashboard() {

  if (!currentUser) {

    hideAllSections();

    document.getElementById("authSection")
      .classList.remove("hidden");

    return;
  }

  hideAllSections();

  document.getElementById("dashboardSection")
    .classList.remove("hidden");

  loadServers();
}


function showAdmin() {

  if (
    !currentUser ||
    currentUser.role !== "admin"
  ) {

    alert("Administrator access required.");

    return;
  }

  hideAllSections();

  document.getElementById("adminSection")
    .classList.remove("hidden");

  adminSettings();
}


/* =========================================================
   CREATE SERVER
   ========================================================= */

async function createServer() {

  const body = {

    name:
      document.getElementById("serverName").value.trim(),

    ram_mb:
      Number(
        document.getElementById("serverRam").value
      ),

    disk_mb:
      Number(
        document.getElementById("serverDisk").value
      ),

    cpu_vcpu:
      Number(
        document.getElementById("serverCpu").value
      ),

    software:
      document.getElementById("serverSoftware").value,

    version:
      document.getElementById("serverVersion").value.trim()
  };

  if (!body.name) {

    showMessage(
      "createMessage",
      "Enter a server name.",
      "error"
    );

    return;
  }

  try {

    await api(
      "/api/servers",
      {
        method: "POST",
        body
      }
    );

    showMessage(
      "createMessage",
      "Server created successfully."
    );

    document.getElementById("serverName").value = "";

    await loadServers();

  } catch (error) {

    showMessage(
      "createMessage",
      error.message,
      "error"
    );
  }
}


/* =========================================================
   LOAD SERVERS
   ========================================================= */

async function loadServers() {

  const container =
    document.getElementById("servers");

  container.innerHTML =
    '<div class="empty">Loading servers...</div>';

  try {

    const servers =
      await api("/api/servers");

    if (!servers.length) {

      container.innerHTML =
        '<div class="empty">No servers yet.</div>';

      return;
    }

    container.innerHTML =
      servers.map(renderServer).join("");

  } catch (error) {

    container.innerHTML =
      `<div class="danger">${escapeHtml(error.message)}</div>`;
  }
}


/* =========================================================
   SERVER CARD
   ========================================================= */

function renderServer(server) {

  const status =
    server.status || "stopped";

  return `
    <div class="card server-card">

      <div class="server-head">

        <div>

          <div class="server-name">
            🖥️ ${escapeHtml(server.name)}
          </div>

          <div class="muted">
            ${escapeHtml(server.software)}
            ${escapeHtml(server.version)}
          </div>

        </div>

        <span class="status ${escapeHtml(status)}">
          ${escapeHtml(sta
