<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HarvixPanel - Console</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/server/console.css">
</head>
<body class="server-page">
  <main class="server-container">
    
<div class="console-container">
  <pre id="consoleOutput" class="console-output">Loading console...</pre>
  <div class="console-input">
    <input id="consoleCommand" type="text" placeholder="Type a server command...">
    <button id="sendCommand">Send</button>
  </div>
</div>

  </main>
  <script src="/js/server/console.js"></script>
</body>
</html>
