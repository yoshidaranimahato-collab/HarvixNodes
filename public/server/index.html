<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HarvixPanel - Server Overview</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/server/index.css">
</head>
<body class="server-page">
  <main class="server-container">
    
<div class="server-header">
  <div>
    <h1 id="serverName">Server</h1>
    <p>Status: <span id="serverStatus">Loading...</span></p>
  </div>
  <div class="server-actions">
    <button id="startServer" class="start">Start</button>
    <button id="restartServer" class="restart">Restart</button>
    <button id="stopServer" class="stop">Stop</button>
  </div>
</div>

  </main>
  <script src="/js/server/index.js"></script>
</body>
</html>
