<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HarvixPanel - Login</title>

    <link rel="stylesheet" href="/css/style.css">

    <!-- AUTH BACKGROUND -->
    <style>
        body.auth-page {
            min-height: 100vh;

            background-image:
                linear-gradient(
                    rgba(5, 5, 12, 0.60),
                    rgba(5, 5, 12, 0.78)
                ),
                url("https://cdn.discordapp.com/attachments/1525395710919577711/1543212815773339669/f543191bef69dd4a3e07ae7a53d25ca8.jpg?ex=6a940c6e&is=6a92baee&hm=047926b0f7f2d25442a3b5d7aba8cecfad7b3c12d1846b671891ebf072327352&");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card">

            <!-- LOGO -->
            <div class="auth-logo">
                <h1>Harvix<span>Panel</span></h1>

                <p>
                    Minecraft Server Management Panel
                </p>
            </div>


            <!-- MESSAGE -->
            <div
                id="message"
                class="message"
            ></div>


            <!-- =================================
                 LOGIN FORM
                 ================================= -->

            <form
                id="loginForm"
                class="auth-form active"
            >

                <h2>Welcome back</h2>

                <p class="subtitle">
                    Login to your HarvixPanel account.
                </p>


                <div class="form-group">

                    <label for="loginIdentifier">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="loginIdentifier"
                        name="identifier"
                        placeholder="Enter username or email"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                    class="auth-button"
                >
                    Login
                </button>

            </form>


            <!-- =================================
                 REGISTER FORM
                 ================================= -->

            <form
                id="registerForm"
                class="auth-form"
            >

                <h2>Create account</h2>

                <p class="subtitle">
                    Create your HarvixPanel account.
                </p>


                <!-- FIRST + LAST NAME -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="First name"
                            autocomplete="given-name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="lastName">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="Last name"
                            autocomplete="family-name"
                            required
                        >

                    </div>

                </div>


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="registerUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="registerUsername"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Minimum 6 characters"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="registerConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="registerConfirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    id="registerButton"
                    class="auth-button"
                >
                    Register
                </button>

            </form>


            <!-- =================================
                 LOGIN / REGISTER SWITCH
                 ================================= -->

            <div
                class="auth-switch"
                id="loginSwitch"
            >

                <span>
                    Don't have an account?
                </span>

                <button
                    type="button"
                    id="showRegister"
                >
                    Register
                </button>

            </div>


            <div
                class="auth-switch"
                id="registerSwitch"
            >

                <span>
                    Already have an account?
                </span>

                <button
                    type="button"
                    id="showLogin"
                >
                    Login
                </button>

            </div>

        </section>

    </main>


    <!-- AUTH JAVASCRIPT -->

    <script src="/js/auth.js"></script>

</body>
</html>
