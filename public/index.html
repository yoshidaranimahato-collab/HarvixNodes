<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HarvixPanel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 15% 20%, rgba(150, 40, 255, .25), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(255, 40, 190, .18), transparent 30%),
        #09060e;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 25px;
    }

    /* NAVBAR */

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 10px 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 21px;
      font-weight: 800;
    }

    .logo-box {
      width: 40px;
      height: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      background: linear-gradient(135deg, #7d1cff, #bd45ff);
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .nav-buttons button {
      padding: 10px 17px;

      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.1);

      background: rgba(255,255,255,.05);
      color: white;

      cursor: pointer;
    }

    .nav-buttons .register {
      border: none;
      background: linear-gradient(135deg,#8b20e8,#a52cff);
    }

    /* HERO */

    .hero {
      min-height: 75vh;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .hero-content {
      max-width: 700px;
    }

    .badge {
      display: inline-block;

      padding: 8px 13px;
      margin-bottom: 20px;

      border-radius: 99px;

      color: #d49aff;
      background: rgba(160,50,255,.1);
      border: 1px solid rgba(160,50,255,.2);

      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      font-size: clamp(42px, 8vw, 72px);
      line-height: 1;

      background: linear-gradient(90deg,#fff,#c36cff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-top: 20px;

      color: rgba(255,255,255,.55);

      font-size: 16px;
      line-height: 1.6;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;

      margin-top: 30px;
    }

    .hero-buttons button {
      padding: 14px 22px;

      border-radius: 12px;
      border: none;

      color: white;
      background: linear-gradient(135deg,#8b20e8,#a52cff);

      font-weight: 700;
      cursor: pointer;
    }

    .hero-buttons .login-btn {
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.05);
    }

    /* AUTH MODAL */

    .overlay {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0,0,0,.72);
      backdrop-filter: blur(8px);

      z-index: 100;
    }

    .overlay.show {
      display: flex;
    }

    .auth-box {
      width: 100%;
      max-width: 410px;

      padding: 28px;

      border-radius: 20px;

      background: #120d1a;
      border: 1px solid rgba(255,255,255,.1);

      box-shadow: 0 25px 80px rgba(0,0,0,.5);
    }

    .auth-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 22px;
    }

    .auth-header h2 {
      font-size: 23px;
    }

    .close {
      width: 35px;
      height: 35px;

      border: none;
      border-radius: 9px;

      background: rgba(255,255,255,.06);
      color: white;

      cursor: pointer;
      font-size: 18px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      color: rgba(255,255,255,.65);
      font-size: 13px;
    }

    .field input {
      width: 100%;
      height: 48px;

      padding: 0 14px;

      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;

      outline: none;

      background: rgba(255,255,255,.04);
      color: white;

      font-size: 14px;
    }

    .field input:focus {
      border-color: #a52cff;
      box-shadow: 0 0 0 3px rgba(165,44,255,.12);
    }

    .auth-submit {
      width: 100%;
      height: 48px;

      margin-top: 5px;

      border: none;
      border-radius: 10px;

      background: linear-gradient(135deg,#8b20e8,#a52cff);

      color: white;
      font-weight: 700;

      cursor: pointer;
    }

    .switch {
      margin-top: 17px;

      text-align: center;

      color: rgba(255,255,255,.45);
      font-size: 13px;
    }

    .switch button {
      border: none;
      background: none;
      color: #bd66ff;
      cursor: pointer;
    }

    .message {
      display: none;

      margin-bottom: 14px;
      padding: 11px;

      border-radius: 9px;

      font-size: 13px;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #ffadb8;
      background: rgba(255,50,80,.1);
    }

    .message.success {
      color: #a8ffd1;
      background: rgba(50,255,150,.1);
    }

    @media (max-width: 600px) {

      .container {
        padding: 18px;
      }

      .nav-buttons button {
        padding: 9px 12px;
      }

      .hero-buttons {
        flex-direction: column;
      }

      .hero-buttons button {
        width: 100%;
      }

      .auth-box {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <nav>

    <div class="logo">

      <div class="logo-box">
        H
      </div>

      HarvixPanel

    </div>

    <div class="nav-buttons">

      <button onclick="openLogin()">
        Login
      </button>

      <button
        class="register"
        onclick="openRegister()"
      >
        Register
      </button>

    </div>

  </nav>


  <section class="hero">

    <div class="hero-content">

      <div class="badge">
        MINECRAFT HOSTING PANEL
      </div>

      <h1>
        HarvixPanel
      </h1>

      <p class="subtitle">
        Simple, fast and powerful Minecraft server
        management from one panel.
      </p>

      <div class="hero-buttons">

        <button onclick="openRegister()">
          Create Account
        </button>

        <button
          class="login-btn"
          onclick="openLogin()"
        >
          Login
        </button>

      </div>

    </div>

  </section>

</div>


<!-- AUTH MODAL -->

<div
  class="overlay"
  id="authOverlay"
>

  <div class="auth-box">

    <div class="auth-header">

      <h2 id="authTitle">
        Login
      </h2>

      <button
        class="close"
        onclick="closeAuth()"
      >
        ×
      </button>

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <!-- LOGIN -->

    <form id="loginForm">

      <div class="field">

        <label>
          Username
        </label>

        <input
          id="loginUsername"
          type="text"
          placeholder="Enter username"
          required
        >

      </div>


      <div class="field">

        <label>
          Password
        </label>

        <input
          id="loginPassword"
          type="password"
          placeholder="Enter password"
          required
        >

      </div>


      <button
        class="auth-submit"
        type="submit"
      >
        Login
      </button>

    </form>


    <!-- REGISTER -->

    <form
      id="registerForm"
      style="display:none;"
    >

      <div class="field">

        <label>
          Username
        </label>

        <input
          id="registerUsername"
          type="text"
          placeholder="Choose username"
          minlength="3"
          required
        >

      </div>


      <div class="field">

        <label>
          Email
        </label>

        <input
          id="registerEmail"
          type="email"
          placeholder="Enter email"
          required
        >

      </div>


      <div class="field">

        <label>
          Password
        </label>

        <input
          id="registerPassword"
          type="password"
          placeholder="Create password"
          minlength="6"
          required
        >

      </div>


      <button
        class="auth-submit"
        type="submit"
      >
        Create Account
      </button>

    </form>


    <div class="switch">

      <span id="switchText">
        Don't have an account?
      </span>

      <button
        id="switchButton"
        onclick="toggleAuth()"
      >
        Register
      </button>

    </div>

  </div>

</div>


<script>

  let loginMode = true;


  function openLogin() {

    loginMode = true;

    document
      .getElementById("authOverlay")
      .classList.add("show");

    updateAuth();

  }


  function openRegister() {

    loginMode = false;

    document
      .getElementById("authOverlay")
      .classList.add("show");

    updateAuth();

  }


  function closeAuth() {

    document
      .getElementById("authOverlay")
      .classList.remove("show");

    clearMessage();

  }


  function toggleAuth() {

    loginMode = !loginMode;

    updateAuth();

  }


  function updateAuth() {

    const title =
      document.getElementById("authTitle");

    const login =
      document.getElementById("loginForm");

    const register =
      document.getElementById("registerForm");

    const text =
      document.getElementById("switchText");

    const button =
      document.getElementById("switchButton");


    if (loginMode) {

      title.textContent = "Login";

      login.style.display = "block";

      register.style.display = "none";

      text.textContent =
        "Don't have an account?";

      button.textContent =
        "Register";

    } else {

      title.textContent = "Create Account";

      login.style.display = "none";

      register.style.display = "block";

      text.textContent =
        "Already have an account?";

      button.textContent =
        "Login";

    }

    clearMessage();

  }


  function showMessage(
    message,
    type
  ) {

    const box =
      document.getElementById("message");

    box.textContent = message;

    box.className =
      "message show " + type;

  }


  function clearMessage() {

    const box =
      document.getElementById("message");

    box.textContent = "";

    box.className = "message";

  }


  /* LOGIN */

  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        clearMessage();


        const username =
          document
            .getElementById("loginUsername")
            .value
            .trim();

        const password =
          document
            .getElementById("loginPassword")
            .value;


        try {

          const response =
            await fetch(
              "/api/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  username,
                  password
                })
              }
            );


          const contentType =
            response.headers
              .get("content-type") || "";


          /*
           * Prevent the
           * "Unexpected token <"
           * error when server returns HTML.
           */

          if (
            !contentType.includes(
              "application/json"
            )
          ) {

            throw new Error(
              "Login API is not available. Check server.js."
            );

          }


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.message ||
              "Login failed."
            );

          }


          if (data.token) {

            localStorage.setItem(
              "harvix_token",
              data.token
            );

          }


          if (data.user) {

            localStorage.setItem(
              "harvix_user",
              JSON.stringify(
                data.user
              )
            );

          }


          showMessage(
            "Login successful!",
            "success"
          );


          setTimeout(
            function() {

              if (
                data.user &&
                data.user.role === "admin"
              ) {

                window.location.href =
                  "/admin.html";

              } else {

                window.location.href =
                  "/dashboard.html";

              }

            },
            600
          );


        } catch(error) {

          showMessage(
            error.message,
            "error"
          );

        }

      }
    );


  /* REGISTER */

  document
    .getElementById("registerForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        clearMessage();


        const username =
          document
            .getElementById(
              "registerUsername"
            )
            .value
            .trim();

        const email =
          document
            .getElementById(
              "registerEmail"
            )
            .value
            .trim();

        const password =
          document
            .getElementById(
              "registerPassword"
            )
            .value;


        try {

          const response =
            await fetch(
              "/api/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  username,
                  email,
                  password
                })
              }
            );


          const contentType =
            response.headers
              .get("content-type") || "";


          if (
            !contentType.includes(
              "application/json"
            )
          ) {

            throw new Error(
              "Register API is not available. Check server.js."
            );

          }


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.message ||
              "Registration failed."
            );

          }


          showMessage(
            "Account created successfully! You can now login.",
            "success"
          );


          document
            .getElementById(
              "registerForm"
            )
            .reset();


          setTimeout(
            function() {

              openLogin();

            },
            1000
          );


        } catch(error) {

          showMessage(
            error.message,
            "error"
          );

        }

      }
    );


  /* CLOSE WHEN CLICKING OUTSIDE */

  document
    .getElementById("authOverlay")
    .addEventListener(
      "click",
      function(event) {

        if (
          event.target === this
        ) {

          closeAuth();

        }

      }
    );

</script>

</body>
</html>
