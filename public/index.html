<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HarvixPanel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      overflow-x: hidden;
      background:
        linear-gradient(rgba(20, 5, 35, 0.55), rgba(10, 3, 25, 0.75)),
        url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1600&q=80")
        center/cover fixed no-repeat;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 20% 20%, rgba(174, 70, 255, 0.28), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(255, 40, 180, 0.22), transparent 35%);
      pointer-events: none;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 18px;
    }

    .auth-box {
      width: 100%;
      max-width: 480px;
      padding: 35px;
      border-radius: 22px;

      background: rgba(25, 15, 35, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 58px;
      height: 58px;
      border-radius: 15px;
      object-fit: cover;
      display: block;
      margin: 0 auto 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .brand-name {
      font-size: 27px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin-top: 7px;
      color: rgba(255,255,255,0.65);
      font-size: 14px;
    }

    .form-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .form-description {
      color: rgba(255,255,255,0.68);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 19px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 600;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 19px;
      opacity: 0.65;
      pointer-events: none;
    }

    .field input {
      width: 100%;
      height: 58px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      outline: none;

      background: rgba(5, 5, 10, 0.48);
      color: #fff;

      padding: 0 18px 0 50px;
      font-size: 16px;

      transition: 0.2s;
    }

    .field input::placeholder {
      color: rgba(255,255,255,0.48);
    }

    .field input:focus {
      border-color: #9b35ff;
      box-shadow: 0 0 0 3px rgba(155, 53, 255, 0.14);
    }

    .main-button {
      width: 100%;
      height: 59px;
      border: none;
      border-radius: 14px;
      cursor: pointer;

      color: white;
      font-size: 17px;
      font-weight: 700;

      background: linear-gradient(135deg, #8b20e8, #a52cff);

      box-shadow: 0 10px 25px rgba(143, 35, 235, 0.25);
      transition: 0.2s;
    }

    .main-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .main-button:active {
      transform: translateY(1px);
    }

    .message {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: rgba(255, 50, 80, 0.15);
      border: 1px solid rgba(255, 80, 100, 0.3);
      color: #ffb5bf;
    }

    .message.success {
      display: block;
      background: rgba(50, 255, 150, 0.12);
      border: 1px solid rgba(50, 255, 150, 0.25);
      color: #a8ffd1;
    }

    .switch {
      text-align: center;
      margin-top: 24px;
      color: rgba(255,255,255,0.65);
      font-size: 15px;
    }

    .switch button {
      border: none;
      background: transparent;
      color: #c15cff;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    .switch button:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 520px) {
      .page {
        padding: 18px 14px;
      }

      .auth-box {
        padding: 27px 20px;
        border-radius: 19px;
      }

      .form-title {
        font-size: 29px;
      }

      .brand-name {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>

  <main class="page">

    <!-- REGISTER -->
    <section class="auth-box" id="registerBox">

      <div class="brand">
        <!-- Baad me apna HarvixPanel logo yahan laga sakte ho -->
        <div class="brand-name">HarvixPanel</div>
        <div class="brand-subtitle">Minecraft Hosting Panel</div>
      </div>

      <h1 class="form-title">Create account</h1>

      <p class="form-description">
        Sign up to start managing your servers.
      </p>

      <div id="registerMessage" class="message"></div>

      <form id="registerForm">

        <div class="field">
          <label>Username</label>

          <div class="input-wrap">
            <span class="input-icon">♙</span>
            <input
              type="text"
              id="registerUsername"
              placeholder="Choose a username"
              minlength="3"
              maxlength="24"
              required
            >
          </div>
        </div>

        <div class="field">
          <label>Password</label>

          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="registerPassword"
              placeholder="Create a password"
              minlength="6"
              required
            >
          </div>
        </div>

        <div class="field">
          <label>Confirm Password</label>

          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="registerConfirm"
              placeholder="Confirm your password"
              minlength="6"
              required
            >
          </div>
        </div>

        <button class="main-button" type="submit">
          Create account &nbsp; →
        </button>

      </form>

      <div class="switch">
        Already have an account?
        <button type="button" onclick="showLogin()">Sign in</button>
      </div>

    </section>


    <!-- LOGIN -->
    <section class="auth-box hidden" id="loginBox">

      <div class="brand">
        <div class="brand-name">HarvixPanel</div>
        <div class="brand-subtitle">Minecraft Hosting Panel</div>
      </div>

      <h1 class="form-title">Login</h1>

      <p class="form-description">
        Welcome to the panel.
      </p>

      <div id="loginMessage" class="message"></div>

      <form id="loginForm">

        <div class="field">
          <label>Username</label>

          <div class="input-wrap">
            <span class="input-icon">♙</span>
            <input
              type="text"
              id="loginUsername"
              placeholder="Username"
              required
            >
          </div>
        </div>

        <div class="field">
          <label>Password</label>

          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="loginPassword"
              placeholder="Password"
              required
            >
          </div>
        </div>

        <button class="main-button" type="submit">
          Sign In
        </button>

      </form>

      <div class="switch">
        Don't have an account?
        <button type="button" onclick="showRegister()">Register</button>
      </div>

    </section>

  </main>


  <script>
    const registerBox = document.getElementById("registerBox");
    const loginBox = document.getElementById("loginBox");

    function showLogin() {
      registerBox.classList.add("hidden");
      loginBox.classList.remove("hidden");

      clearMessages();
    }

    function showRegister() {
      loginBox.classList.add("hidden");
      registerBox.classList.remove("hidden");

      clearMessages();
    }

    function showMessage(id, text, type) {
      const box = document.getElementById(id);

      box.textContent = text;
      box.className = "message " + type;
    }

    function clearMessages() {
      document.getElementById("registerMessage").className = "message";
      document.getElementById("loginMessage").className = "message";
    }


    // REGISTER
    document
      .getElementById("registerForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
          document.getElementById("registerUsername").value.trim();

        const password =
          document.getElementById("registerPassword").value;

        const confirm =
          document.getElementById("registerConfirm").value;

        if (password !== confirm) {
          showMessage(
            "registerMessage",
            "Passwords do not match.",
            "error"
          );
          return;
        }

        try {

          const response = await fetch("/api/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              username,
              password
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(
              data.message || data.error || "Registration failed."
            );
          }

          showMessage(
            "registerMessage",
            "Account created successfully! You can now sign in.",
            "success"
          );

          document.getElementById("registerForm").reset();

          setTimeout(() => {
            showLogin();
          }, 1200);

        } catch (error) {

          showMessage(
            "registerMessage",
            error.message || "Something went wrong.",
            "error"
          );

        }

      });


    // LOGIN
    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
          document.getElementById("loginUsername").value.trim();

        const password =
          document.getElementById("loginPassword").value;

        try {

          const response = await fetch("/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              username,
              password
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(
              data.message || data.error || "Invalid username or password."
            );
          }

          if (data.token) {
            localStorage.setItem("harvix_token", data.token);
          }

          if (data.user) {
            localStorage.setItem(
              "harvix_user",
              JSON.stringify(data.user)
            );
          }

          showMessage(
            "loginMessage",
            "Login successful! Redirecting...",
            "success"
          );

          setTimeout(() => {

            if (
              data.user &&
              data.user.role === "admin"
            ) {
              window.location.href = "/admin.html";
            } else {
              window.location.href = "/dashboard.html";
            }

          }, 700);

        } catch (error) {

          showMessage(
            "loginMessage",
            error.message || "Login failed.",
            "error"
          );

        }

      });
  </script>

</body>
</html>
