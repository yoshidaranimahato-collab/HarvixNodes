<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HarvixPanel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #08060f;
      overflow-x: hidden;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          rgba(10, 6, 20, 0.35),
          rgba(10, 6, 20, 0.55)
        ),
        url("https://images.unsplash.com/photo-1605899435973-ca2d1a8861cf?auto=format&fit=crop&w=1600&q=85");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      padding: 25px;
    }

    /* =========================
       AUTH CARD
    ========================= */

    .auth-card {
      width: 100%;
      max-width: 520px;

      padding: 38px 40px 30px;

      background: rgba(18, 15, 30, 0.94);

      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 8px;

      box-shadow:
        0 25px 70px rgba(0,0,0,0.55),
        0 0 30px rgba(130,40,255,0.08);
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;

      margin: 0 auto 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: linear-gradient(
        135deg,
        #7c19ff,
        #b52cff
      );

      color: white;
      font-size: 17px;
      font-weight: 900;

      box-shadow:
        0 0 20px rgba(151,43,255,0.4);
    }

    .brand-name {
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    /* =========================
       FORMS
    ========================= */

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .title {
      text-align: center;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 26px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      color: rgba(255,255,255,0.72);

      font-size: 11px;
      font-weight: 500;
    }

    .field input {
      width: 100%;
      height: 43px;

      padding: 0 12px;

      border: 1px solid #cbd0d8;
      border-radius: 4px;

      outline: none;

      background: #ffffff;
      color: #222;

      font-size: 13px;

      transition: .2s;
    }

    .field input:focus {
      border-color: #4388f5;

      box-shadow:
        0 0 0 2px rgba(67,136,245,.15);
    }

    /* REGISTER TWO COLUMNS */

    .two-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* =========================
       BUTTON
    ========================= */

    .submit-btn {
      width: 100%;
      height: 44px;

      margin-top: 6px;

      border: none;
      border-radius: 4px;

      background: #4388ed;

      color: white;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      transition: .2s;
    }

    .submit-btn:hover {
      background: #3479df;
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* =========================
       LINKS
    ========================= */

    .switch-text {
      text-align: center;

      margin-top: 17px;

      color: rgba(255,255,255,.5);

      font-size: 11px;
    }

    .switch-text button {
      border: none;
      background: none;

      color: #4388ed;

      cursor: pointer;

      font-size: 11px;
      font-weight: 600;
    }

    .switch-text button:hover {
      text-decoration: underline;
    }

    .forgot {
      display: block;

      margin-top: 13px;

      text-align: center;

      color: rgba(255,255,255,.35);

      font-size: 9px;

      text-decoration: none;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: none;

      margin-bottom: 15px;

      padding: 10px 12px;

      border-radius: 5px;

      font-size: 11px;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(255,60,80,.12);
      border: 1px solid rgba(255,60,80,.25);
      color: #ff9aa8;
    }

    .message.success {
      background: rgba(50,220,130,.10);
      border: 1px solid rgba(50,220,130,.22);
      color: #82f0ad;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 24px;

      text-align: center;

      color: rgba(255,255,255,.18);

      font-size: 9px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 550px) {

      .page {
        padding: 15px;
      }

      .auth-card {
        padding: 30px 20px 25px;
      }

      .two-columns {
        grid-template-columns: 1fr;
        gap: 0;
      }

    }

  </style>
</head>

<body>

<div class="page">

  <div class="auth-card">

    <!-- BRAND -->

    <div class="brand">

      <div class="brand-logo">
        H
      </div>

      <div class="brand-name">
        HarvixPanel
      </div>

    </div>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- =====================
         LOGIN
    ====================== -->

    <form
      id="loginForm"
      class="auth-form active"
    >

      <h1 class="title">
        Login
      </h1>


      <div class="field">

        <label>
          USERNAME OR EMAIL
        </label>

        <input
          id="loginIdentifier"
          type="text"
          placeholder="Username or Email"
          autocomplete="username"
          required
        >

      </div>


      <div class="field">

        <label>
          PASSWORD
        </label>

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        type="submit"
        class="submit-btn"
        id="loginButton"
      >
        Login
      </button>


      <a
        href="#"
        class="forgot"
        onclick="return false;"
      >
        FORGOT PASSWORD?
      </a>


      <div class="switch-text">

        Don't have an account?

        <button
          type="button"
          id="showRegister"
        >
          Register here.
        </button>

      </div>

    </form>


    <!-- =====================
         REGISTER
    ====================== -->

    <form
      id="registerForm"
      class="auth-form"
    >

      <h1 class="title">
        Registration
      </h1>


      <div class="two-columns">

        <div class="field">

          <label>
            FIRST NAME
          </label>

          <input
            id="firstName"
            type="text"
            placeholder="First Name"
            autocomplete="given-name"
            required
          >

        </div>


        <div class="field">

          <label>
            LAST NAME
          </label>

          <input
            id="lastName"
            type="text"
            placeholder="Last Name"
            autocomplete="family-name"
            required
          >

        </div>

      </div>


      <div class="two-columns">

        <div class="field">

          <label>
            USERNAME
          </label>

          <input
            id="registerUsername"
            type="text"
            placeholder="Username"
            autocomplete="username"
            required
          >

        </div>


        <div class="field">

          <label>
            E-MAIL
          </label>

          <input
            id="registerEmail"
            type="email"
            placeholder="Email"
            autocomplete="email"
            required
          >

        </div>

      </div>


      <div class="two-columns">

        <div class="field">

          <label>
            PASSWORD
          </label>

          <input
            id="registerPassword"
            type="password"
            placeholder="Password"
            autocomplete="new-password"
            required
          >

        </div>


        <div class="field">

          <label>
            REPEAT PASSWORD
          </label>

          <input
            id="registerConfirmPassword"
            type="password"
            placeholder="Repeat Password"
            autocomplete="new-password"
            required
          >

        </div>

      </div>


      <button
        type="submit"
        class="submit-btn"
        id="registerButton"
      >
        Register
      </button>


      <div class="switch-text">

        Already have an account?

        <button
          type="button"
          id="showLogin"
        >
          Login here.
        </button>

      </div>

    </form>


    <div class="footer">
      HarvixPanel • Minecraft Server Management
    </div>

  </div>

</div>


<script src="/js/auth.js"></script>

</body>
</html>
