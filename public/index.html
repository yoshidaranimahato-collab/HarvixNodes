<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HarvixPanel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090c12;
      color: #edf2f7;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px 22px;
      background: #111722;
      border-bottom: 1px solid #252d3a;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: #111722;
      border: 1px solid #252d3a;
      border-radius: 14px;
      padding: 18px;
      margin: 14px 0;
    }

    input,
    select,
    button {
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #303a49;
      background: #0b1018;
      color: white;
      margin: 4px;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #182131;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hidden {
      display: none;
    }

    .muted {
      color: #9ba7b7;
    }

    .ok {
      color: #78e6a0;
    }

    .danger {
      color: #ff8c8c;
    }

    .server {
      margin-bottom: 20px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #080b10;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
    }

    .badge {
      padding: 5px 9px;
      border-radius: 20px;
      background: #182131;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <b>
    ⚡ <span id="brand">
      HarvixPanel
    </span>
  </b>

  <span id="userInfo" class="muted">
    Not logged in
  </span>
</header>

<main>

  <!-- AUTH -->

  <section id="authBox" class="card">

    <h2>HarvixPanel Login</h2>

    <input
      id="username"
      placeholder="Username"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <br>

    <button onclick="login()">
      Login
    </button>

    <button onclick="register()">
      Register
    </button>

    <p id="authMessage" class="muted"></p>

  </section>


  <!-- APP -->

  <section id="appBox" class="hidden">

    <div class="card">

      <button onclick="logout()">
        Logout
      </button>

      <button
        id="adminButton"
        class="hidden"
        onclick="showAdminPanel()"
      >
        👑 Admin Panel
      </button>

    </div>


    <!-- CREATE SERVER -->

    <div class="card">

      <h2>
        Create Server
      </h2>

      <div class="grid">

        <input
          id="serverName"
          placeholder="Server name"
        >

        <input
          id="serverRam"
          type="number"
          value="1024"
          placeholder="RAM MB"
        >

        <input
          id="serverDisk"
          type="number"
          value="2048"
          placeholder="Disk MB"
        >

        <input
          id="serverCpu"
          type="number"
          value="1"
          step="0.1"
          placeholder="vCPU"
        >

        <select id="serverSoftware">

          <option value="Paper">
            Paper
          </option>

          <option value="Vanilla">
            Vanilla
          </option>

          <option value="Fabric">
            Fabric
          </option>

          <option value="Forge">
            Forge
          </option>

        </select>

        <input
          id="serverVersion"
          value="1.21.4"
          placeholder="Version"
        >

      </div>

      <button onclick="createServer()">
        Create Server
      </button>

      <p class="muted">
        Normal user limit:
        4096 MB RAM •
        5120 MB Disk •
        1 vCore
      </p>

    </div>


    <!-- SERVERS -->

    <div class="card">

      <h2>
        My Servers
      </h2>

      <div id="servers">
        Loading...
      </div>

    </div>


    <!-- ADMIN -->

    <div
      id="adminPanel"
      class="hidden"
    ></div>

  </section>

</main>


<script>

let token =
  localStorage.getItem(
    "harvix_token"
  );

let currentUser = null;


/* =========================
   API HELPER
========================= */

async function api(
  url,
  options = {}
) {

  options.headers =
    options.headers || {};

  if (token) {

    options.headers.Authorization =
      "Bearer " + token;

  }

  if (
    options.body &&
    typeof options.body !== "string"
  ) {

    options.headers[
      "Content-Type"
    ] = "application/json";

    options.body =
      JSON.stringify(
        options.body
      );
  }

  const response =
    await fetch(
      url,
      options
    );

  const data =
    await response
      .json()
      .catch(() => ({}));

  if (!response.ok) {

    throw new Error(
      data.error ||
      "Request failed."
    );

  }

  return data;
}


/* =========================
   SAFE HTML
========================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    character => {

      const map = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      };

      return map[character];

    }
  );
}


/* =========================
   REGISTER
========================= */

async function register() {

  const username =
    document
      .getElementById("username")
      .value;

  const password =
    document
      .getElementById("password")
      .value;

  try {

    await api(
      "/api/auth/register",
      {
        method: "POST",

        body: {
          username,
          password
        }
      }
    );

    document
      .getElementById(
        "authMessage"
      )
      .textContent =
      "Account created. Now login.";

  } catch (error) {

    document
      .getElementById(
        "authMessage"
      )
      .textContent =
      error.message;

  }
}


/* =========================
   LOGIN
========================= */

async function login() {

  const username =
    document
      .getElementById("username")
      .value;

  const password =
    document
      .getElementById("password")
      .value;

  try {

    const result =
      await api(
        "/api/auth/login",
        {
          method: "POST",

          body: {
            username,
            password
          }
        }
      );

    token =
      result.token;

    localStorage.setItem(
      "harvix_token",
      token
    );

    await boot();

  } catch (error) {

    document
      .getElementById(
        "authMessage"
      )
      .textContent =
      error.message;

  }
}


/* =========================
   BOOT
========================= */

async function boot() {

  if (!token) {
    return;
  }

  try {

    currentUser =
      await api(
        "/api/auth/me"
      );

    document
      .getElementById(
        "authBox"
      )
      .classList
      .add("hidden");

    document
      .getElementById(
        "appBox"
      )
      .classList
      .remove("hidden");

    document
      .getElementById(
        "userInfo"
      )
      .textContent =
      currentUser.username +
      " • " +
      currentUser.role;

    if (
      currentUser.role ===
      "admin"
    ) {

      document
        .getElementById(
          "adminButton"
        )
        .classList
        .remove("hidden");

    }

    loadServers();

  } catch (error) {

    logout();

  }
}


/* =========================
   LOGOUT
========================= */

function logout() {

  localStorage.removeItem(
    "harvix_token"
  );

  token = null;

  location.reload();
}


/* =========================
   CREATE SERVER
========================= */

async function createServer() {

  try {

    await api(
      "/api/servers",
      {
        method: "POST",

        body: {

          name:
            document
              .getElementById(
                "serverName"
              ).value,

          ram_mb:
            Number(
              document
                .getElementById(
                  "serverRam"
                ).value
            ),

          disk_mb:
            Number(
              document
                .getElementById(
                  "serverDisk"
                ).value
            ),

          cpu_vcpu:
            Number(
              document
                .getElementById(
                  "serverCpu"
                ).value
            ),

          software:
            document
              .getElementById(
                "serverSoftware"
              ).value,

          version:
            document
              .getElementById(
                "serverVersion"
              ).value

        }

      }
    );

    alert(
      "Server created successfully."
    );

    loadServers();

  } catch (error) {

    alert(
      error.message
    );

  }
}


/* =========================
   LOAD SERVERS
========================= */

async function loadServers() {

  const container =
    document.getElementById(
      "servers"
    );

  try {

    const servers =
      await api(
        "/api/servers"
      );

    if (!servers.length) {

      container.innerHTML =
        '<p class="muted">' +
        "No servers yet." +
        "</p>";

      return;
    }

    container.innerHTML =
      servers
        .map(
          server =>
            createServerCard(
              server
            )
        )
        .join("");

  } catch (error) {

    container.innerHTML =
      `<p class="danger">
        ${escapeHtml(
          error.message
        )}
      </p>`;

  }
}


/* =========================
   SERVER CARD
========================= */

function createServerCard(
  server
) {

  const statusClass =
    server.status ===
    "running"
      ? "ok"
      : "danger";

  return `

    <div class="card server">

      <h3>
        🖥️
        ${escapeHtml(
          server.name
        )}
      </h3>

      <p class="muted">

        ${escapeHtml(
          server.software
        )}

        ${escapeHtml(
          server.version
        )}

        •
        ${server.ram_mb} MB RAM

        •
        ${server.disk_mb} MB Disk

        •
        ${server.cpu_vcpu} vCPU

      </p>

      <p class="${statusClass}">
        Status:
        ${escapeHtml(
          server.status
        )}
      </p>

      <div class="tabs">

        <button
          onclick="openModule(
            ${server.id},
            'console'
          )"
        >
          Console
        </button>

        <button
          onclick="openModule(
            ${server.id},
            'file-manager'
          )"
        >
          File Manager
        </button>

        <button
          onclick="openModule(
            ${server.id},
            'sftp'
          )"
        >
          SFTP
        </button>

        <button
          onclick="openModule(
            ${server.id},
            'plugin-installer'
          )"
        >
          Plugin Installer
        </button>

        <button
          onclick="openModule(
            ${server.id},
            'mod-manager'
          )"
        >
          Mod Manager
        </button>

        <button
          onclick="openModule(
            ${server.id},
            'votifier'
          )"
        >
          Votifier Test
        </button>

        <button
          onclick="openModule(
            ${server.id},
            'server-splitter'
          )"
        >
          Server Splitter
        </button>

        <button
          onclick="openServerSettings(
            ${server.id}
          )"
        >
          Settings
        </button>

      </div>

      <div
        id="module-${server.id}"
      ></div>

      <hr>

      <button
        onclick="serverAction(
          ${server.id},
          'start'
        )"
      >
        Start
      </button>

      <button
        onclick="serverAction(
          ${server.id},
          'restart'
        )"
      >
        Restart
      </button>

      <button
        onclick="serverAction(
          ${server.id},
          'stop'
        )"
      >
        Stop
      </button>

      <button
        onclick="serverAction(
          ${server.id},
          'reinstall'
        )"
      >
        Reinstall
      </button>

    </div>

  `;
}


/* =========================
   SERVER ACTION
========================= */

async function serverAction(
  id,
  action
) {

  try {

    await api(
      `/api/servers/${id}/${action}`,
      {
        method: "POST"
      }
    );

    loadServers();

  } catch (error) {

    alert(
      error.message
    );

  }
}


/* =========================
   MODULE
========================= */

async function openModule(
  id,
  module
) {

  const box =
    document.getElementById(
      `module-${id}`
    );

  try {

    const result =
      await api(
        `/api/servers/${id}/${module}`
      );

    box.innerHTML = `

      <div class="card">

        <h3>
          ${escapeHtml(
            module
          )}
        </h3>

        <pre>${escapeHtml(
          JSON.stringify(
            result,
            null,
            2
          )
        )}</pre>

      </div>

    `;

  } catch (error) {

    alert(
      error.message
    );

  }
}


/* =========================
   SERVER SETTINGS
========================= */

async function openServerSettings(
  id
) {

  const box =
    document.getElementById(
      `module-${id}`
    );

  try {

    const server =
      await api(
        `/api/servers/${id}`
      );

    box.innerHTML = `

      <div class="card">

        <h3>
          ⚙️ Server Settings
        </h3>

        <p>
          <button
            onclick="serverAction(
              ${id},
              'reinstall'
            )"
          >
            Reinstall Server
          </button>
        </p>

        <p>

          <input
            id="version-${id}"
            value="${escapeHtml(
              server.version
            )}"
            placeholder="Version"
          >

          <button
            onclick="changeVersion(
              ${id}
            )"
          >
            Change Version Type
          </button>

        </p>

        <p>

          <select
            id="software-${id}"
          >

            <option>Paper</option>
            <option>Vanilla</option>
            <option>Fabric</option>
            <option>Forge</option>

          </select>

          <button
            onclick="changeSoftware(
              ${id}
            )"
          >
            Change Software
          </button>

        </p>

        ${
          currentUser.role ===
          "admin"

            ? `

              <hr>

              <h4>
                🔐 IP Alias
                (Admin Only)
              </h4>

              <input
                id="alias-${id}"
                value="${escapeHtml(
                  server.alias_ip || ""
                )}"
                placeholder="Playit/MineKube address"
              >

              <button
                onclick="saveAlias(
                  ${id}
                )"
              >
                Save
              </button>

              <p class="muted">
                IP Alias only stores an
                address you control. It
                does not create DNS or
                networking automatically.
              </p>

            `

            : ""
        }

      </div>

    `;

  } catch (error) {

    alert(
      error.message
    );

  }
}


/* =========================
   VERSION
========================= */

async function changeVersion(
  id
) {

  const value =
    document
      .getElementById(
        `version-${id}`
      )
      .value;

  try {

    await api(
      `/api/servers/${id}/version`,
      {
        method: "PUT",

        body: {
          version: value
        }
      }
    );

    loadServers();

  } catch (error) {

    alert(
      error.message
    );

  }
}


/* =========================
   SOFTWARE
========================= */

async function changeSoftware(
  id
) {

  const value =
    document
      .getElementById(
        `software-${id}`
      )
      .value;

  try {

    await api(
      `/api/servers/${id}/software`,
      {
        method: "PUT",

        body: {
          software: value
        }
      }
    );

    loadServers();

  } catch (error) {

    alert(
      error.message
    );

  }
}


/* =========================
   IP ALIAS
========================= */

async function saveAlias(
  id
) {

  const value =
    document
      .getElementById(
        `alias-${id}`
      )
      .value;

  try {

    await api(
      `/api/servers/${id}/alias`,
      {
        method: "PUT",

        body: {
          alias_ip: value
        }
      }
    );

    alert(
      "IP Alias saved."
    );

  } catch (error) {

    alert(
      error.message
    );

  }
}


/* =========================
   ADMIN PANEL
========================= */

async function showAdminPanel() {

  const panel =
    document.getElementById(
      "adminPanel"
    );

  panel.classList.remove(
    "hidden"
  );

  panel.innerHTML = `

    <div class="card">

      <h2>
        👑 Admin Panel
      </h2>

      <button
        onclick="adminSettings()"
      >
        ⚙️ Settings
      </button>

      <button
        onclick="adminNodes()"
      >
        🖥️ Nodes
      </button>

      <button
        onclick="adminUsers()"
      >
        👥 Users
      </button>

      <div
        id="adminContent"
      ></div>

    </div>

  `;
}


/* =========================
   ADMIN SETTINGS
========================= */

async function adminSettings() {

  const content =
    document.getElementById(
      "adminContent"
    );

  try {

    const settings =
      await api(
        "/api/settings"
      );

    content.innerHTML = `

      <div class="card">

        <h3>
          Panel Settings
        </h3>

        <input
          id="panelName"
          value="${escapeHtml(
            settings.server_name
          )}"
          placeholder="Server name"
        >

        <input
          id="panelIcon"
          value="${escapeHtml(
            settings.server_icon
          )}"
          placeholder="Server icon"
        >

        <button
          onclick="savePanelSettings()"
        >
          Save
        </button>

      </div>

    `;

  } catch (error) {

    alert(
      error.message
    );

  }
}


/* =========================
   SAVE ADMIN SETTINGS
========================= */

async function savePanelSettings() {

  try {

    const result =
      await api(
        "/api/settings",
        {
          method: "PUT",

          body: {

            server_name:
              document
                .getElementById(
                  "panelName"
                ).value,

            server_icon:
              document
                .getElementById(
                  "panelIcon"
                ).value

          }
        }
      );

    document
      .getElementById(
        "brand"
      )
      .textContent =
      result.server_name;

    alert(
      "Settings saved."
    );

  } catch (error) {

    alert(
      error.message
    );

  }
}


/* =========================
   ADMIN NODES
========================= */

async function adminNodes() {

  const content =
    document.getElementById(
      "adminContent"
    );

  try {

    const nodes =
      await api(
        "/api/nodes"
      );

    if (!nodes.length) {

      content.innerHTML =
        `<div class="card">
          No nodes found.
        </div>`;

      retur
