<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HarvixPanel</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b0b0f;
      color: white;
    }

    .navbar {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      background: #111118;
      border-bottom: 1px solid #292934;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 17px;
      cursor: pointer;
      font-size: 14px;
    }

    .login-btn {
      background: #272733;
      color: white;
    }

    .register-btn {
      background: #6d35ff;
      color: white;
    }

    .logout-btn {
      background: #d83232;
      color: white;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 70px 20px;
      text-align: center;
    }

    h1 {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 40px;
    }

    .card {
      background: #15151e;
      border: 1px solid #292934;
      border-radius: 14px;
      padding: 30px;
      margin: 20px auto;
      max-width: 450px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;
      background: #15151e;
      border: 1px solid #30303d;
      border-radius: 14px;
      padding: 28px;
    }

    .modal-box h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 13px;
      border-radius: 8px;
      border: 1px solid #363642;
      background: #0d0d13;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #6d35ff;
    }

    .submit-btn {
      width: 100%;
      background: #6d35ff;
      color: white;
      margin-top: 5px;
    }

    .close-btn {
      width: 100%;
      background: #292934;
      color: white;
      margin-top: 10px;
    }

    .message {
      min-height: 22px;
      margin-top: 13px;
      font-size: 14px;
    }

    .user-info {
      display: none;
      align-items: center;
      gap: 10px;
    }

    .welcome {
      color: #aaa;
    }

  </style>
</head>


<body>

  <nav class="navbar">

    <div class="logo">
      HarvixPanel
    </div>

    <div class="nav-buttons">

      <div
        id="authButtons"
        class="nav-buttons"
      >

        <button
          class="login-btn"
          id="loginButton"
        >
          Login
        </button>

        <button
          class="register-btn"
          id="registerButton"
        >
          Register
        </button>

      </div>


      <div
        id="userInfo"
        class="user-info"
      >

        <span
          class="welcome"
          id="welcomeText"
        ></span>

        <button
          class="logout-btn"
          id="logoutButton"
        >
          Logout
        </button>

      </div>

    </div>

  </nav>


  <main class="container">

    <h1>
      HarvixPanel
    </h1>

    <p class="subtitle">
      Minecraft Hosting Control Panel
    </p>


    <div class="card">

      <h2>
        Panel Online
      </h2>

      <p style="color:#aaa;margin-top:10px;">
        Create an account or login to continue.
      </p>

    </div>

  </main>


  <!-- LOGIN MODAL -->

  <div
    class="modal"
    id="loginModal"
  >

    <div class="modal-box">

      <h2>
        Login
      </h2>

      <form id="loginForm">

        <input
          type="text"
          id="loginUsername"
          placeholder="Username"
          autocomplete="username"
          required
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button
          type="submit"
          class="submit-btn"
        >
          Login
        </button>

      </form>

      <div
        class="message"
        id="loginMessage"
      ></div>

      <button
        class="close-btn"
        id="closeLogin"
      >
        Close
      </button>

    </div>

  </div>


  <!-- REGISTER MODAL -->

  <div
    class="modal"
    id="registerModal"
  >

    <div class="modal-box">

      <h2>
        Create Account
      </h2>

      <form id="registerForm">

        <input
          type="text"
          id="registerUsername"
          placeholder="Username"
          autocomplete="username"
          required
        >

        <input
          type="password"
          id="registerPassword"
          placeholder="Password"
          autocomplete="new-password"
          required
        >

        <button
          type="submit"
          class="submit-btn"
        >
          Register
        </button>

      </form>

      <div
        class="message"
        id="registerMessage"
      ></div>

      <button
        class="close-btn"
        id="closeRegister"
      >
        Close
      </button>

    </div>

  </div>


  <script>

    const loginButton =
      document.getElementById(
        "loginButton"
      );

    const registerButton =
      document.getElementById(
        "registerButton"
      );

    const logoutButton =
      document.getElementById(
        "logoutButton"
      );


    const loginModal =
      document.getElementById(
        "loginModal"
      );

    const registerModal =
      document.getElementById(
        "registerModal"
      );


    const closeLogin =
      document.getElementById(
        "closeLogin"
      );

    const closeRegister =
      document.getElementById(
        "closeRegister"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );

    const registerForm =
      document.getElementById(
        "registerForm"
      );


    const loginMessage =
      document.getElementById(
        "loginMessage"
      );

    const registerMessage =
      document.getElementById(
        "registerMessage"
      );


    const authButtons =
      document.getElementById(
        "authButtons"
      );

    const userInfo =
      document.getElementById(
        "userInfo"
      );

    const welcomeText =
      document.getElementById(
        "welcomeText"
      );


    function openModal(modal) {

      modal.classList.add(
        "active"
      );

    }


    function closeModal(modal) {

      modal.classList.remove(
        "active"
      );

    }


    loginButton.addEventListener(
      "click",
      () => {

        loginMessage.textContent = "";

        openModal(loginModal);

      }
    );


    registerButton.addEventListener(
      "click",
      () => {

        registerMessage.textContent = "";

        openModal(registerModal);

      }
    );


    closeLogin.addEventListener(
      "click",
      () => {

        closeModal(loginModal);

      }
    );


    closeRegister.addEventListener(
      "click",
      () => {

        closeModal(registerModal);

      }
    );


    window.addEventListener(
      "click",
      event => {

        if (
          event.target === loginModal
        ) {
          closeModal(loginModal);
        }

        if (
          event.target === registerModal
        ) {
          closeModal(registerModal);
        }

      }
    );


    registerForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        registerMessage.textContent =
          "Creating account...";

        const username =
          document.getElementById(
            "registerUsername"
          ).value.trim();

        const password =
          document.getElementById(
            "registerPassword"
          ).value;


        try {

          const response =
            await fetch(
              "/api/auth/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  username,
                  password
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            registerMessage.textContent =
              data.message ||
              "Registration failed.";

            return;
          }


          localStorage.setItem(
            "harvix_token",
            data.token
          );


          registerMessage.textContent =
            "Account created!";


          registerForm.reset();

          setTimeout(
            () => {

              closeModal(
                registerModal
              );

              updateUI(
                data.user
              );

            },
            500
          );


        } catch (error) {

          registerMessage.textContent =
            "Could not connect to panel.";

        }

      }
    );


    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        loginMessage.textContent =
          "Logging in...";


        const username =
          document.getElementById(
            "loginUsername"
          ).value.trim();

        const password =
          document.getElementById(
            "loginPassword"
          ).value;


        try {

          const response =
            await fetch(
              "/api/auth/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  username,
                  password
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            loginMessage.textContent =
              data.message ||
              "Login failed.";

            return;
          }


          localStorage.setItem(
            "harvix_token",
            data.token
          );


          loginMessage.textContent =
            "Login successful!";


          loginForm.reset();


          setTimeout(
            () => {

              closeModal(
                loginModal
              );

              updateUI(
                data.user
              );

            },
            400
          );


        } catch (error) {

          loginMessage.textContent =
            "Could not connect to panel.";

        }

      }
    );


    logoutButton.addEventListener(
      "click",
      async () => {

        localStorage.removeItem(
          "harvix_token"
        );

        showLoggedOut();

      }
    );


    function updateUI(user) {

      authButtons.style.display =
        "none";

      userInfo.style.display =
        "flex";

      welcomeText.textContent =
        `Hi, ${user.username}`;

    }


    function showLoggedOut() {

      authButtons.style.display =
        "flex";

      userInfo.style.display =
        "none";

      welcomeText.textContent =
        "";

    }


    async function checkLogin() {

      const token =
        localStorage.getItem(
          "harvix_token"
        );

      if (!token) {

        showLoggedOut();

        return;

      }


      try {

        const response =
          await fetch(
            "/api/auth/me",
            {
              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        if (!response.ok) {

          localStorage.removeItem(
            "harvix_token"
          );

          showLoggedOut();

          return;
        }


        const data =
          await response.json();


        updateUI(
          data.user
        );


      } catch (error) {

        showLoggedOut();

      }

    }


    checkLogin();

  </script>

</body>

</html>
